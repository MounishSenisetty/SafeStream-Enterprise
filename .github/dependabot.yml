version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  # Base image digests pinned in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The builder's Python must match the distroless runtime's (3.11): the
      # compiled wheels it installs are ABI-specific. Take digest (security)
      # updates only; move both stages to a new Python together, by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
