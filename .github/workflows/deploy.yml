# Cloudflare: infrastructure (Terraform) and the public site (Pages).
#
# Off until the repository variable CLOUDFLARE_ENABLED is "true" and the
# secrets in infra/cloudflare/README.md exist. Then:
#   pull request  -> terraform plan, shown in the job log
#   push to main  -> plan, then apply and site deploy once a reviewer approves
#                    the "cloudflare" environment (configure required reviewers
#                    on it: without them the apply runs unattended).
name: Deploy

on:
  push:
    branches: [main]
    paths: ["infra/**", "control-plane/**", "docs/**", "overrides/**", "mkdocs.yml", "README.md", "SECURITY.md", "CHANGELOG.md", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      production:
        description: Also deploy the control plane to production (api.safestreamdata.com)
        type: boolean
        default: false

permissions:
  contents: read

# One Terraform run at a time against the shared state; never cancel an apply.
concurrency:
  group: cloudflare
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # Who Cloudflare Access lets through to the console: JSON lists in repository
  # variables, e.g. CONSOLE_ALLOWED_EMAILS = ["you@example.com"]. Unset: nobody.
  TF_VAR_console_allowed_emails: ${{ vars.CONSOLE_ALLOWED_EMAILS || '[]' }}
  TF_VAR_console_allowed_email_domains: ${{ vars.CONSOLE_ALLOWED_EMAIL_DOMAINS || '[]' }}
  # R2 API token for the state bucket (S3-compatible credentials).
  AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_R2_SECRET_ACCESS_KEY }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: terraform plan
    if: vars.CLOUDFLARE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.5"
      - name: terraform init
        working-directory: infra/cloudflare
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TFSTATE_BUCKET || 'safestream-tfstate' }}"
          -backend-config="endpoints={s3=\"https://${ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
      - run: terraform -chdir=infra/cloudflare plan -lock-timeout=5m

  apply:
    name: terraform apply
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.5"
      - name: terraform init
        working-directory: infra/cloudflare
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TFSTATE_BUCKET || 'safestream-tfstate' }}"
          -backend-config="endpoints={s3=\"https://${ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
      # ponytail: plans again instead of applying the reviewed plan file; state is
      # locked and changes are rare. Pass the plan as an artifact if that gap matters.
      - run: terraform -chdir=infra/cloudflare apply -auto-approve -lock-timeout=5m
      - id: outputs
        run: |
          echo "d1=$(terraform -chdir=infra/cloudflare output -json d1_database_ids)" >> "$GITHUB_OUTPUT"
          echo "aud=$(terraform -chdir=infra/cloudflare output -json console_access_aud)" >> "$GITHUB_OUTPUT"
    outputs:
      d1_database_ids: ${{ steps.outputs.outputs.d1 }}
      console_access_aud: ${{ steps.outputs.outputs.aud }}

  control-plane:
    name: deploy the control plane
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    defaults:
      run:
        working-directory: control-plane
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_IDS: ${{ needs.apply.outputs.d1_database_ids }}
      ACCESS_AUDS: ${{ needs.apply.outputs.console_access_aud }}
      # <team>.cloudflareaccess.com, from the Zero Trust dashboard.
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: fill in the D1 database ids and the console's Access settings from Terraform
        run: |
          sed -i "s/D1_ID_STAGING/$(echo "$D1_IDS" | jq -r .staging)/; s/D1_ID_PRODUCTION/$(echo "$D1_IDS" | jq -r .production)/" wrangler.jsonc
          sed -i "s/ACCESS_AUD_STAGING/$(echo "$ACCESS_AUDS" | jq -r .staging)/; s/ACCESS_AUD_PRODUCTION/$(echo "$ACCESS_AUDS" | jq -r .production)/" wrangler.jsonc
          # Unset: the placeholder is replaced by nothing, and the console stays closed (503).
          sed -i "s/ACCESS_TEAM_DOMAIN_VALUE/${ACCESS_TEAM_DOMAIN}/" wrangler.jsonc
      - name: staging
        env:
          SECRETS: ${{ secrets.CONTROL_PLANE_SECRETS_STAGING }}
        run: |
          # Without its two secrets the Worker cannot create tenants or sign
          # policies: refuse to deploy rather than ship one that looks healthy.
          if ! echo "$SECRETS" | jq -e '.PLATFORM_ADMIN_TOKEN and .KEY_ENCRYPTION_KEY' > /dev/null 2>&1; then
            echo "::error::Secret CONTROL_PLANE_SECRETS_STAGING must be JSON with PLATFORM_ADMIN_TOKEN and KEY_ENCRYPTION_KEY (see control-plane/README.md)"
            exit 1
          fi
          npx wrangler d1 migrations apply safestream-staging --env staging --remote
          npx wrangler deploy --env staging
          echo "$SECRETS" | npx wrangler secret bulk --env staging
      - name: production
        if: github.event_name == 'workflow_dispatch' && inputs.production
        env:
          SECRETS: ${{ secrets.CONTROL_PLANE_SECRETS_PRODUCTION }}
        run: |
          # Without its two secrets the Worker cannot create tenants or sign
          # policies: refuse to deploy rather than ship one that looks healthy.
          if ! echo "$SECRETS" | jq -e '.PLATFORM_ADMIN_TOKEN and .KEY_ENCRYPTION_KEY' > /dev/null 2>&1; then
            echo "::error::Secret CONTROL_PLANE_SECRETS_PRODUCTION must be JSON with PLATFORM_ADMIN_TOKEN and KEY_ENCRYPTION_KEY (see control-plane/README.md)"
            exit 1
          fi
          npx wrangler d1 migrations apply safestream-production --env production --remote
          npx wrangler deploy --env production
          echo "$SECRETS" | npx wrangler secret bulk --env production

  site:
    name: deploy the public site
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install "mkdocs-material==9.8.1"
      - run: mkdocs build
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: upload to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.0 pages deploy site --project-name=safestream-site --branch=main
