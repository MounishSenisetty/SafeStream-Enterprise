name: CI

on:
  push:
    # PR branches are covered by pull_request (running both would double every
    # run); tags by release.yml, which calls this workflow.
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Weekly, so a newly published CVE in a dependency or base image is caught
    # even when nobody is pushing.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Integration tests skip themselves here (no broker).
      - run: pytest -q --cov=safestream_enterprise --cov-fail-under=90
      # A floor, not a tight gate: shared runners are too noisy for a percentage
      # comparison. It catches an accidental 2x slowdown (docs/benchmarks.md has
      # the measured numbers).
      - run: python bench/run.py --seconds 2 --min-rate 1000

  audit:
    name: dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      # The lock file is exactly what the image installs.
      - run: pip-audit -r requirements.txt --require-hashes --disable-pip

  integration:
    name: real Kafka + container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        # Single-node KRaft broker; advertises PLAINTEXT://localhost:9092.
        image: apache/kafka:4.3.2
        ports: ["9092:9092"]
        env:
          # The runner prints the broker's whole log when the job ends; at INFO
          # that is thousands of lines after the test output.
          KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The distroless runtime is CPython 3.13; test the same interpreter.
          python-version: "3.13"
          cache: pip
      # The same hash-locked dependencies the image installs. pip check fails
      # if requirements.txt has drifted outside the ranges in pyproject.toml.
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install --no-deps -e . && pip install pytest && pip check
      - name: build image
        run: docker build -t safestream-enterprise:ci .
      # The real Worker, in workerd with local D1 and R2: nothing touches
      # Cloudflare. tests/test_control_integration.py drives a connector against it.
      - name: start the control plane locally
        working-directory: control-plane
        run: |
          npm ci --no-audit --no-fund
          printf 'PLATFORM_ADMIN_TOKEN="ci-platform-admin"\nKEY_ENCRYPTION_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="\n' > "$RUNNER_TEMP/dev.vars"
          npx wrangler d1 migrations apply DB --local --env staging
          nohup npx wrangler dev --env staging --local --ip 127.0.0.1 --port 8787 \
            --env-file "$RUNNER_TEMP/dev.vars" > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8787/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/wrangler.log"
          exit 1
      - name: integration tests
        env:
          SAFESTREAM_IT_BOOTSTRAP: localhost:9092
          SAFESTREAM_IT_IMAGE: safestream-enterprise:ci
          # Lets the fault-injection test kill and restart the broker.
          SAFESTREAM_IT_KAFKA_CONTAINER: ${{ job.services.kafka.id }}
          SAFESTREAM_IT_CONTROL_URL: http://127.0.0.1:8787
          SAFESTREAM_IT_PLATFORM_TOKEN: ci-platform-admin
        run: pytest -v -rs tests/test_kafka_integration.py tests/test_control_integration.py
      - name: image vulnerability scan (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: safestream-enterprise:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  manifests:
    name: validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm lint deploy/helm/safestream-enterprise
      - name: rendered manifests are up to date with the chart
        run: deploy/render.sh && git diff --exit-code deploy/kubernetes
      - name: kubeconform (chart with every optional part enabled)
        run: >-
          helm template safestream deploy/helm/safestream-enterprise --namespace safestream
          --set autoscaling.enabled=true --set prometheusRule.enabled=true
          --set dashboard.enabled=true --set namespace.create=true
          --set control.enabled=true --set 'policy.publicKeys={dGVzdC1rZXktbm90LXJlYWw=}'
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -
      - name: kubeconform (strict schema validation)
        run: >-
          docker run --rm -v "$PWD/deploy:/deploy:ro" ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          /deploy/kubernetes/

  infra:
    name: Terraform (Cloudflare) format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.5"
      - run: terraform fmt -check -recursive infra
      # No credentials and no state: this checks the configuration against the
      # provider's schema. Planning against the account is in deploy.yml.
      - run: terraform -chdir=infra/cloudflare init -backend=false -input=false
      - run: terraform -chdir=infra/cloudflare validate

  control-plane:
    name: control plane (Workers runtime tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 22 is preinstalled on the runner.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Runs inside workerd with local D1 and R2: the same runtime as production.
      - run: npm test

  site:
    name: build the public site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install "mkdocs-material==9.8.1"
      # strict: a broken link or include fails the build.
      - run: mkdocs build
        env:
          NO_MKDOCS_2_WARNING: "1"

  e2e:
    name: Helm chart on Kubernetes (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image
        run: docker build -t safestream-enterprise:ci .
      # kind, kubectl and helm are preinstalled on the runner.
      - name: create cluster and load the image
        run: |
          kind create cluster --wait 120s
          kind load docker-image safestream-enterprise:ci
      - name: install the chart and redact a record end to end
        run: deploy/e2e/run.sh safestream-enterprise ci
      - name: diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n safestream describe pods
          kubectl -n safestream logs -l app.kubernetes.io/name=safestream-kafka-redactor --tail=100
          kubectl -n kafka logs deploy/kafka --tail=50
