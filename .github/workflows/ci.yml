name: CI

on:
  push:
    # PR branches are covered by pull_request (running both would double every
    # run); tags by release.yml, which calls this workflow.
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Integration tests skip themselves here (no broker).
      - run: pytest -q

  integration:
    name: real Kafka + container image
    runs-on: ubuntu-latest
    services:
      kafka:
        # Single-node KRaft broker; advertises PLAINTEXT://localhost:9092.
        image: apache/kafka:4.3.2
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The distroless runtime is CPython 3.11; test the same interpreter.
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: build image
        run: docker build -t safestream-enterprise:ci .
      - name: integration tests
        env:
          SAFESTREAM_IT_BOOTSTRAP: localhost:9092
          SAFESTREAM_IT_IMAGE: safestream-enterprise:ci
        run: pytest -v -rs tests/test_kafka_integration.py

  manifests:
    name: validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubeconform (strict schema validation)
        run: >-
          docker run --rm -v "$PWD/deploy:/deploy:ro" ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary /deploy/kubernetes/
