[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "safestream-enterprise"
dynamic = ["version"]
description = "Schema-aware PII & secret redaction for enterprise data pipelines, built on safestream-redactor."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mounish Senisetty" }]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  # The open-source engine: detection tiers, redaction policies, streaming core.
  # Pinned to the minor series whose public API (Redactor, RedactionPolicy,
  # Detection, RedactionStats) this package is written against.
  "safestream-redactor>=0.5.0,<0.6",
  # Kafka connector; librdkafka is bundled inside the wheel.
  "confluent-kafka>=2.3,<3",
  # Validated, secret-safe connector configuration.
  "pydantic>=2.6,<3",
  # Rust JSON parser/serialiser for the structured redaction hot path.
  "orjson>=3.10,<4",
  # Ed25519 signatures on policy bundles (the standard library has none).
  "cryptography>=43",
]

[project.optional-dependencies]
docs = ["mkdocs-material==9.8.1"]
dev = ["pytest>=7", "pytest-cov>=5", "hypothesis>=6.100", "mypy>=1.8", "ruff>=0.15,<0.18"]

[project.scripts]
safestream-kafka = "safestream_enterprise.connectors.kafka:main"
safestream-batch = "safestream_enterprise.batch:main"
safestream-dlq = "safestream_enterprise.dlq:main"
safestream-policy = "safestream_enterprise.policy:main"
safestream-audit = "safestream_enterprise.audit:main"

[tool.hatch.version]
path = "src/safestream_enterprise/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/safestream_enterprise"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# confluent-kafka ships partial stubs; tolerate gaps rather than vendoring our own.
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true
