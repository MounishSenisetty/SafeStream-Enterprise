# The public site (https://safestreamdata.com): landing page and documentation.
#   pip install -e ".[docs]" && mkdocs serve
site_name: SafeStream Enterprise
site_url: https://safestreamdata.com/
site_description: >-
  Redact personal data, payment data and credentials from Kafka and data-lake
  streams in flight, inside your own network.
copyright: Copyright &copy; 2026 Mounish Senisetty. All rights reserved.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  custom_dir: overrides
  font: false # system fonts: no request to a third-party font host
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight

extra_css:
  - assets/site.css

nav:
  - Home: index.md
  - Documentation: guide.md
  - Benchmarks: benchmarks.md
  - Security: security.md
  - Changelog: changelog.md

hooks:
  - overrides/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
