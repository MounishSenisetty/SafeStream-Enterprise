{{- if .Values.prometheusRule.enabled }}
# Alerts for the SafeStream Enterprise Kafka connector (Prometheus Operator).
# Without the operator, copy spec.groups into a plain Prometheus rules file.
# Thresholds are starting points; lag on partitions nobody is consuming is only
# visible to a Kafka-side exporter (group = KAFKA_GROUP_ID).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "safestream.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "safestream.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: safestream-kafka-redactor
      rules:
        - alert: SafeStreamNotConsuming
          # absent(): also fires when every pod is gone and the series with it.
          expr: sum(safestream_ready) < 1 or absent(safestream_ready)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No SafeStream connector is consuming.
            description: >-
              No replica has been ready for 5 minutes. Raw records are piling
              up on the ingress topic and nothing reaches the clean topic.
        - alert: SafeStreamMainLoopStalled
          expr: safestream_heartbeat_age_seconds > 120
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: SafeStream connector {{`{{ $labels.pod }}`}} has stopped advancing.
            description: >-
              The main loop has not advanced for {{`{{ $value | humanizeDuration }}`}}.
              The liveness probe should restart the pod; if this persists, it is not.
        - alert: SafeStreamDeadLetterRate
          expr: sum(rate(safestream_records_total{destination="dlq"}[5m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: SafeStream is dead-lettering records.
            description: >-
              Records have been going to the DLQ for 15 minutes: a producer is
              sending records that are neither JSON nor XML, or the clean topic
              is rejecting them. The x-safestream-error header names the cause.
        - alert: SafeStreamLagGrowing
          expr: sum(safestream_consumer_lag_records) > 100000
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: SafeStream is falling behind the ingress topic.
            description: >-
              More than 100,000 records have been waiting for 15 minutes. Add
              replicas (up to the partition count) or enable autoscaling.
        - alert: SafeStreamPolicyRefused
          expr: sum(increase(safestream_policy_rejections_total[10m])) > 0
          labels:
            severity: critical
          annotations:
            summary: SafeStream refused a policy bundle.
            description: >-
              A bundle with a bad signature, an older version, another tenant
              or invalid rules was put in place. Redaction continues under the
              policy already in force. Find out who changed the bundle: this
              is either a publishing mistake or an attempt to weaken redaction.
        - alert: SafeStreamTransactionAborts
          expr: sum(increase(safestream_transaction_aborts_total[10m])) > 5
          labels:
            severity: warning
          annotations:
            summary: SafeStream transactions keep aborting.
            description: >-
              More than 5 aborted transactions in 10 minutes (exactly-once mode).
              Check broker health and the transaction coordinator.
        - alert: SafeStreamAuditEventsFailing
          expr: sum(increase(safestream_audit_failures_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: SafeStream audit events are not being delivered.
            description: >-
              Redaction continues and no counts are lost (each window is carried
              into the next event), but the audit topic is receiving nothing.
              Check the topic exists and the connector may write to it.
        - alert: SafeStreamCanaryLeak
          expr: sum(increase(safestream_canary_leaks_total[15m])) > 0
          labels:
            severity: critical
          annotations:
            summary: A SafeStream leak canary found PII surviving redaction.
            description: >-
              Synthetic records with made-up PII came out of the live redactor
              unredacted. Real records under the same policy may be leaking to
              the clean topic now. Check which policy version the pod runs
              (safestream_policy_version) and what changed in it.
        - alert: SafeStreamControlPlaneUnreachable
          expr: min(safestream_control_connected) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: SafeStream cannot reach the control plane.
            description: >-
              Redaction continues under the policy in force and audit events
              wait in a queue (safestream_control_queue_depth), but new
              policies are not arriving. Check egress to the control plane.
{{- end }}
