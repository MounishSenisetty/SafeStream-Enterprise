# SafeStream Enterprise: Kafka redaction connector.
#
# Consumes ingress-logs, publishes egress-logs-clean, routes unprocessable
# records to ingress-logs-dlq. Replicas share one consumer group: scale up to
# the ingress topic's partition count (extra replicas sit idle).
#
#   kubectl create namespace safestream
#   kubectl -n safestream create secret generic safestream-secrets \
#     --from-literal=hmac-key="$(openssl rand -hex 32)" \
#     --from-literal=sasl-username=svc-safestream \
#     --from-literal=sasl-password='...'
#   kubectl apply -f deploy/kubernetes/kafka-redactor.yaml
#
# Assumes the brokers run in namespace "kafka" with pod label
# app.kubernetes.io/name=kafka, listening on 9092. Adjust the NetworkPolicy
# selectors to match your cluster (e.g. strimzi.io/cluster for Strimzi).
---
# Customer field rules, added to the built-in PCI/HIPAA/GDPR rules (see
# "Custom field rules" in the README for the format). They are read once at
# startup and validated: a bad file stops the pod with a clear error instead of
# leaving a field unredacted. After editing, roll the pods so every replica
# uses the same rules:
#   kubectl -n safestream rollout restart deployment/safestream-kafka-redactor
apiVersion: v1
kind: ConfigMap
metadata:
  name: safestream-field-rules
  namespace: safestream
data:
  field-rules.json: |
    {
      "mode": "extend",
      "rules": {
        "*loyalty_number*": "id_number",
        "*member_id*": "id_number"
      },
      "disable": []
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safestream-kafka-redactor
  namespace: safestream
  labels:
    app.kubernetes.io/name: safestream-kafka-redactor
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: safestream-kafka-redactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safestream-kafka-redactor
      annotations:
        # Annotation-based discovery; with the Prometheus Operator use a PodMonitor
        # on the "metrics" port instead. /metrics carries counts, never content.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: /metrics
    spec:
      # Time to finish the in-flight batch, wait for egress acks and commit
      # after SIGTERM. Must exceed SAFESTREAM_FLUSH_TIMEOUT_S.
      terminationGracePeriodSeconds: 60
      # The connector never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redactor
          image: ghcr.io/mounishsenisetty/safestream-enterprise:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: KAFKA_GROUP_ID
              value: "safestream-redactor"
            - name: INGRESS_TOPIC
              value: "ingress-logs"
            - name: EGRESS_TOPIC
              value: "egress-logs-clean"
            - name: DLQ_TOPIC
              value: "ingress-logs-dlq"
            # Payloads that are neither JSON nor XML. dlq: send them to the DLQ;
            # redact_text: text-redact them and deliver them to egress.
            - name: SAFESTREAM_UNPARSEABLE
              value: "dlq"
            # at_least_once, or exactly_once: one Kafka transaction per batch. Exactly-once
            # needs a TransactionalId ACL (Write, Describe) for "safestream-redactor-*",
            # and clean-topic consumers must read with isolation.level=read_committed.
            - name: SAFESTREAM_DELIVERY
              value: "at_least_once"
            - name: SAFESTREAM_FIELD_RULES_FILE
              value: "/etc/safestream/field-rules.json"
            - name: SAFESTREAM_MODE
              value: "pseudonymize"
            - name: SAFESTREAM_HMAC_KEY
              valueFrom:
                secretKeyRef: { name: safestream-secrets, key: hmac-key }
            # Any librdkafka property: SAFESTREAM_KAFKA_<PROPERTY, dots as underscores>.
            # Set the protocol to match the 9092 listener (PLAINTEXT, SSL, SASL_SSL).
            - name: SAFESTREAM_KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: SAFESTREAM_KAFKA_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: SAFESTREAM_KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef: { name: safestream-secrets, key: sasl-username }
            - name: SAFESTREAM_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef: { name: safestream-secrets, key: sasl-password }
          # /healthz fails only when the main loop stops advancing (a wedged
          # process), never because the brokers are down: a restart cannot fix
          # the brokers. SAFESTREAM_LIVENESS_TIMEOUT_S (default 120s) bounds it.
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
          resources:
            # Memory is flat: one batch of records at a time, regardless of topic volume.
            requests: { cpu: "500m", memory: "256Mi" }
            limits: { cpu: "2", memory: "512Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: field-rules
              mountPath: /etc/safestream
              readOnly: true
      volumes:
        - name: field-rules
          configMap:
            name: safestream-field-rules
---
# Default-deny for the connector pods. Selecting a pod with both policy types
# denies all ingress and all egress not explicitly allowed below, so the only
# reachable destinations are the Kafka brokers on 9092 and cluster DNS. This is
# the network boundary the OSS in-process guard can't provide here, because
# the connector has to reach Kafka.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: safestream-kafka-redactor
  namespace: safestream
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: safestream-kafka-redactor
  policyTypes: [Ingress, Egress]
  # Ingress: only Prometheus may connect, and only to the metrics port.
  # Kubelet health probes come from the node and are allowed by the CNIs in
  # common use; if yours filters host traffic, allow the node CIDR on 9400.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 9400 }
  egress:
    # Kafka brokers only: namespace AND pod label must both match (same list item).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - { protocol: TCP, port: 9092 }
    # Cluster DNS only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
